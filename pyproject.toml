[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-signal"
version = "1.0.0"
description = "Signal: evaluated anomaly detection and early warning for fleet telemetry"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Huda Mueen" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "mypy>=1.10", "pandas-stubs>=2.2", "types-PyYAML>=6"]

[project.scripts]
signal-data = "fleet_signal.data.cli:main"
signal-features = "fleet_signal.features.cli:main"
signal-eval = "fleet_signal.eval.cli:main"
signal-train = "fleet_signal.train:main"
signal-replay = "fleet_signal.service.replay:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Raised inside pandas 2.3 when running against numpy 2.5; not from our code.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # starlette's TestClient warns about its own httpx dependency; not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
