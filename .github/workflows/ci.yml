name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned by commit SHA (tag in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"   # the exact interpreter the results were produced with
          cache: pip
      - name: Install (exact pinned environment, hash-verified)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -v
      - name: Dependency audit (known vulnerabilities in the pinned set)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --require-hashes --disable-pip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build runtime and test images
        run: |
          docker build -t signal .
          docker build --target test -t signal-test .
      - name: Tests inside the image (no network)
        run: docker run --rm --network none signal-test
      - name: Runtime image serves the verified model as a non-root user
        run: |
          test "$(docker run --rm signal whoami)" = "signal"
          docker run -d --name sig -p 8000:8000 signal
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 2; done
          curl -sf localhost:8000/readyz | grep -q '"status":"ok"'
          docker rm -f sig
