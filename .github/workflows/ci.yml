name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"   # the exact interpreter the results were produced with
          cache: pip
      - name: Install (exact pinned environment)
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -v
